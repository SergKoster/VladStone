services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vladstone
      POSTGRES_USER: vladstone
      POSTGRES_PASSWORD: vladstone
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vladstone -d vladstone"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./VladStoneAPI
    env_file:
      - ./VladStoneAPI/.env.example
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./VladStoneWeb
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8001/api
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8001/api
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
