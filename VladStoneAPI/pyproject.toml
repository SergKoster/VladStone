[project]
name = "vladstone-api"
version = "0.1.0"
description = "VladStone backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "google-auth>=2.0.0",
    "httpx>=0.27.2",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.3",
    "requests>=2.0.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pillow>=11.0.0",
    "pytest>=8.3.3",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
