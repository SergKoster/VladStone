name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VladStoneAPI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: VladStoneAPI/requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

  backend-postgres:
    name: Backend (PostgreSQL concurrency)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VladStoneAPI
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vladstone_test
          POSTGRES_USER: vladstone
          POSTGRES_PASSWORD: vladstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vladstone -d vladstone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: VladStoneAPI/requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: PostgreSQL race regressions
        env:
          TEST_DATABASE_URL: postgresql+psycopg://vladstone:vladstone@localhost:5432/vladstone_test
        run: python -m pytest tests/test_combat_resolve_race.py tests/test_postgres_concurrency.py

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VladStoneWeb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: VladStoneWeb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
